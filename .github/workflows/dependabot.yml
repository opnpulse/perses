name: dependabot
on:
  pull_request:
    paths:
      - '**/go.mod'

permissions:
  contents: write
  pull-requests: write

jobs:
  go-update:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.BOT_TOKEN }}
      - uses: ./.github/actions/setup_environment
        with:
          enable_go: true
          enable_cue: false
      - name: Run go mod tidy
        run: |
          go mod tidy
          cd internal/cli/cmd/dac/build/testdata/go
          go mod tidy
          cd -
          cd go-sdk/test
          go mod tidy
          cd -
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: '[dependabot skip] apply go mod tidy'
          commit_options: '--no-verify --signoff'
          commit_user_name: 'perses-bot'
          commit_user_email: 'perses-team+bot@googlegroups.com'
          commit_author: 'persesbot <perses-team+bot@googlegroups.com>'
