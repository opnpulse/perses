name: e2e
on:
  push:
    branches:
      - '**'
    tags:
      - v*
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_name != 'main' }}

jobs:
  e2e:
    name: end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup_environment
        with:
          enable_npm: true
          enable_go: true
          nvmrc_path: './ui/.nvmrc'
      - name: start dev environment
        uses: hoverkraft-tech/compose-action@ee6af68587292d72db67743171809c19787df4c9 # v3.1.0
        with:
          compose-file: ./dev/docker-compose.e2e.yaml
      - name: Install UI deps
        working-directory: ./ui
        run: npm ci
      - name: Build the app and all packages
        working-directory: ./ui
        run: npm run build
      - name: Install Playwright Browsers
        working-directory: ./ui
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: ./ui
        timeout-minutes: 15
        run: npm run e2e:ci:stream
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report
          path: |
            ui/e2e/playwright-report/
            ui/e2e/test-results/
